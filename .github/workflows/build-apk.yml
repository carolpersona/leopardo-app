name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Versão fixa: garante que todos os pacotes do projeto compilam juntos.
          flutter-version: 3.24.5
          cache: true

      # Gera os arquivos de plataforma que faltam (Gradle, MainActivity etc.).
      # Arquivos que já existem no repositório (como o AndroidManifest.xml) são mantidos.
      - name: Completar projeto Android
        run: flutter create --platforms=android,ios --org br.com.leopardo --project-name leopardo_app .

      # Alguns pacotes antigos compilam Java e Kotlin com versões diferentes;
      # isto evita que o Gradle trate essa diferença como erro.
      - name: Ajustes do Android
        run: |
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> android/gradle.properties
          # Bibliotecas para ler boletos em PDF (texto e código de barras)
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
              implementation 'com.google.zxing:core:3.5.3'
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

      - name: Dependências
        run: flutter pub get

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Testes
        run: flutter test
        continue-on-error: true

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk leopardo-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: leopardo-app-apk
          path: leopardo-app.apk
